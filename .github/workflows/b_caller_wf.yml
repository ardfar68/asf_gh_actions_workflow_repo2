name: caller workflow
on:
  push:
    branches:
      - dev2
  workflow_dispatch:

jobs:

  debug_secret:
    runs-on: ubuntu-latest
    
    steps:
      - name: print out secret
        env:
          caller_secret: ${{ secrets.ASF_REPO_SECRET }}
        run: |
          echo secrets length is: ${#caller_secret}
          echo secrets length is: ${caller_secret:0:7}

  call_reusable_workflow:
    needs: debug_secret
    uses: ardfar68/asf_gh_actions_workflow_repo1/.github/workflows/reusable-workflow.yml@dev1
    with:
      exampleInputNew: "This is from caller wf new"
    secrets:
      asf_secret: ${{ secrets.ASF_REPO_SECRET }}

  print_result_from_reusable_wf_alt1:
    runs-on: ubuntu-latest
    needs: call_reusable_workflow
    steps:
      - name: printing out result from reusable wf
        run: |
          echo sum is: ${{ needs.call_reusable_workflow.outputs.sumOutput }}
          echo sub is: ${{ needs.call_reusable_workflow.outputs.subOutput }}
          echo multi is: ${{ needs.call_reusable_workflow.outputs.multiOutput }}
          echo div is: ${{ needs.call_reusable_workflow.outputs.divOutput }}
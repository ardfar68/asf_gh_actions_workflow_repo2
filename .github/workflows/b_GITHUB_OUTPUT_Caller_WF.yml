name: a2_caller_wf
on:
  workflow_dispatch:
  push:
    branches:
      - dev2

jobs:
  job1_in_caller_wf:
    uses: ardfar68/asf_gh_actions_workflow_repo1/.github/workflows/a_GITHUB_OUTPUT_Reusable_WF.yml@dev1
    with:
      exampleInput: "Test value from caller"
    secrets:
      MY_SECRET: ${{ secrets.ASF_REPO_SECRET }}

  job2_in_caller_wf:
    runs-on: ubuntu-latest
    needs: job1_in_caller_wf
    steps:
      - name: Print the four arithmetic operations from reusable workflow(caller wf)
        run: |
          echo result from reusable wf ${{ needs.job1_in_caller_wf.outputs.all_results }}
        